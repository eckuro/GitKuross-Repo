[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doffin-insights"
version = "0.1.0"
description = "Analyse Norwegian public procurement (Doffin) for enterprise software demand trends"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "tqdm>=4.66",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
doffin-insights = "doffin_insights.cli:app"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
